# Repository toolchain pin (spec section 10, section 86 "rust-toolchain.toml stable-first").
#
# Stable is the daemon/data-plane and Pyrefly-sidecar toolchain. The production MIR
# extractor owns an exact dated nightly in rustc-extractor/rust-toolchain.toml; targeted
# assurance commands may still use a separately installed nightly.
#
# `rustc-dev` is intentionally absent from this root. Compiler-private APIs and their
# required component live only in the isolated extractor domain.

[toolchain]
channel = "stable"
profile = "default"
components = [
  "rustfmt",
  "clippy",
  "rust-analyzer",
  "rust-src",
  "llvm-tools-preview",
]
