# Repository toolchain pin (spec section 10, section 86 "rust-toolchain.toml stable-first").
#
# Stable is the default for all ordinary development. Nightly is a *targeted analysis
# toolchain* only -- `cargo +nightly miri test`, `cargo +nightly udeps` -- and is
# deliberately not pinned here.
#
# `rustc-dev` is intentionally absent (spec section 76): declaring it would couple this
# repository to compiler-private APIs and force an exact date-pinned nightly. If the
# project ever consumes those APIs, that becomes a separate, deliberate architecture
# change, not an edit to this file.

[toolchain]
channel = "stable"
profile = "default"
components = [
  "rustfmt",
  "clippy",
  "rust-analyzer",
  "rust-src",
  "llvm-tools-preview",
]
