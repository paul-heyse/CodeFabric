# Maturin mixed-project layout (spec sections 11 and 44.1):
#   python/codefabric/   public Python package -- the supported contract
#   codefabric._native   private extension built from the Rust crate in src/
#
# `python-source` keeps Python sources out of Cargo's conventional `src/` root; that is a
# packaging/language-boundary choice, not a statement about how either side should be
# decomposed internally (spec section 1.2).

[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "codefabric"
version = "0.1.0"
description = "Present-state code property graph: Rust core with a Python interface layer."
readme = "README.md"
authors = [
    { name = "paul-dottie", email = "105995806+paul-dottie@users.noreply.github.com" }
]
# Spec section 11.1: this floor must stay synchronized with .python-version,
# [tool.ruff] target-version, [tool.pyrefly] python-version, and the CI matrix.
# Relaxed from ">=3.14.7"; a patch-level floor excludes 3.14.0-3.14.6 for no reason.
requires-python = ">=3.14"
dependencies = [
    "attrs>=26.1.0",
    "cattrs>=26.1.0",
    "fastmcp[anthropic,apps,azure,code-mode,gemini,openai,tasks]>=3.4.7",
    "pydantic>=2.13.4",
]

[project.scripts]
codefabric = "codefabric:main"

[tool.maturin]
python-source = "python"
module-name = "codefabric._native"
features = ["python"]

# Spec section 11.2: developer tooling is not a runtime dependency of the package.
[dependency-groups]
dev = [
  "maturin>=1.14,<2",
  "pytest>=9.1.1",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.3",
  "pyrefly>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Required by the Maturin mixed layout: Python sources live under python/, not at the
# repository root, so Ruff's default `src = ["."]` cannot tell first-party imports from
# third-party ones and mis-sorts every import block. The spec's example pyproject assumes
# a default layout and omits this.
src = ["python", "python_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

# Spec section 43: configure Pyrefly explicitly. An unconfigured checker enables only a
# narrow high-confidence diagnostic set; this makes the intended type surface a decision.
[tool.pyrefly]
project-includes = [
  "python/**/*.py",
  "python_tests/**/*.py",
]
python-version = "3.14"
