# Executable dependency policy (spec section 30).
#
# License configuration is retained as a future decision aid but is intentionally not
# invoked by the repository policy recipe or CI. The user excluded license
# considerations from the current implementation on 2026-08-20.
#
# Generated with `cargo deny init` (cargo-deny 0.20.2), then edited deliberately. Spec
# section 30.1 and tooling-ref section 31.3: do not copy another organization's license
# policy, and do not derive an allow-list from whatever happens to be in the graph today.
# The policy below states what this project is willing to depend on; the current graph
# then either satisfies it or produces an exception that needs a reason.

[graph]
# Empty = all targets. This crate has no target-specific dependencies, so narrowing the
# set would only hide findings.
targets = []
# Include the optional S3 deployment profile in policy checks. The default local profile
# is checked separately to prove that it activates neither deltalake-aws nor the AWS SDK;
# the kernel-forced latent object_store cloud features are documented and registry-bound.
all-features = true
no-default-features = false

[output]
feature-depth = 1

# ------------------------------------------------------------------- advisories

# A green scan means the resolved graph matches no known RustSec advisory under the
# current database. It does not mean the dependencies have been security-audited
# (spec section 31).
[advisories]
# Every entry needs a reason, an owner, and a review date. An indefinite ignore is
# suppression, not policy (tooling-ref sections 67.1 and 72.5).
# Exact package/version, rationale, owner, and review-trigger records live in
# tooling/security/advisory-exceptions.json. scripts/advisory_policy_check.sh requires
# exact equality and verifies the selected lockfile plus current RustSec result.
ignore = [
  "RUSTSEC-2024-0436",
  "RUSTSEC-2026-0173",
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

# --------------------------------------------------------------------- licenses

# Permissive licenses only. CodeFabric's future distributed artifacts may statically link
# Rust dependencies, so anything with a copyleft or source-disclosure obligation can
# attach to the artifact. Nothing here is currently distributed under a
# chosen license, which is a separate open decision -- see `private.ignore` below.
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  # Data-only license carried by unicode-ident and the wider unicode-rs family.
  "Unicode-3.0",
]
confidence-threshold = 0.8
# The allow-list is policy, not a mirror of today's graph, so entries that no current
# dependency uses are expected and are not a finding (spec section 30.1).
unused-allowed-license = "allow"
# Narrow, version-aware exceptions with a rationale. Empty is the correct steady state.
exceptions = []

[licenses.private]
# This package sets `publish = false` and deliberately declares no `license` field: no
# license has been chosen for CodeFabric yet, and Cargo.toml is not the place to invent
# one. Without this, cargo-deny reports our own crate as "Unlicensed" and fails.
#
# Revisit when the project picks a license.
ignore = true
registries = []

# ------------------------------------------------------------------------- bans

# Duplicate versions are denied by default. Exact temporary skips below acknowledge
# transitive families that the current graph cannot unify; the Arrow, Parquet,
# DataFusion, object_store, and buoyant-kernel families are deliberately never skipped.
# scripts/duplicate_family_check.sh proves both the config shape and a second-Arrow
# expected-failure fixture.
[bans]
multiple-versions = "deny"
# A wildcard version requirement is never intentional in a locked application.
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-wildcard-paths = true
deny = []
skip = [
  { crate = "block-buffer@0.10.4", reason = "transitive crypto ecosystem split; not a type-bearing CodeFabric family" },
  { crate = "core-foundation@0.9.4", reason = "transitive macOS integration split" },
  { crate = "cpufeatures@0.2.17", reason = "transitive crypto ecosystem split" },
  { crate = "crypto-common@0.1.7", reason = "transitive crypto ecosystem split" },
  { crate = "digest@0.10.7", reason = "transitive crypto ecosystem split" },
  { crate = "foldhash@0.1.5", reason = "transitive collection ecosystem split" },
  { crate = "getrandom@0.2.17", reason = "transitive random ecosystem split" },
  { crate = "getrandom@0.3.4", reason = "transitive random ecosystem split" },
  { crate = "hashbrown@0.14.5", reason = "transitive collection ecosystem split" },
  { crate = "hashbrown@0.15.5", reason = "transitive collection ecosystem split" },
  { crate = "hashbrown@0.16.1", reason = "transitive collection ecosystem split" },
  { crate = "http@0.2.12", reason = "transitive HTTP ecosystem split" },
  { crate = "http-body@0.4.6", reason = "transitive HTTP ecosystem split" },
  { crate = "md-5@0.10.6", reason = "transitive crypto ecosystem split" },
  { crate = "r-efi@5.3.0", reason = "transitive WASI support split" },
  { crate = "rand@0.9.5", reason = "transitive random ecosystem split" },
  { crate = "rand_core@0.9.5", reason = "transitive random ecosystem split" },
  { crate = "reqwest@0.13.4", reason = "transitive HTTP ecosystem split" },
  { crate = "sqlparser@0.62.0", reason = "transitive parser consumers currently require two lines" },
  { crate = "syn@3.0.3", reason = "transitive procedural-macro ecosystem split" },
  { crate = "windows-sys@0.52.0", reason = "transitive Windows support split" },
]
skip-tree = []

# ---------------------------------------------------------------------- sources

# crates.io only. A Git dependency pinned to a branch is materially less reproducible
# than one pinned to an immutable revision (tooling-ref section 31.5); if one becomes
# necessary, add it here explicitly with its exact rev.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/delta-io/delta-rs.git"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
