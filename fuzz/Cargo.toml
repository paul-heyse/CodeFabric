[package]
name = "codefabric-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95.0"
resolver = "3"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
codefabric = { path = "..", default-features = false, features = ["contracts-tooling", "rpc"] }
prost = "=0.14.4"

[[bin]]
name = "jcs_decode_canonicalize"
path = "fuzz_targets/jcs_decode_canonicalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contract_ingress"
path = "fuzz_targets/contract_ingress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity"
path = "fuzz_targets/identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry"
path = "fuzz_targets/registry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_decode"
path = "fuzz_targets/proto_decode.rs"
test = false
doc = false
bench = false
