[package]
name = "codefabric-delta-retained-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
zstd-safe = "=7.2.4"
zstd-sys = "=2.0.16"
deltalake-core = { path = "../../../../third_party/native/delta-rs/crates/core", default-features = false, features = ["rustls"] }
datafusion = { version = "=55.0.0", optional = true }
futures = "=0.3.34"
tokio = { version = "=1.53.1", features = ["native-owned-local", "macros", "rt-multi-thread"] }
tempfile = "=3.27.0"
delta_kernel = { package = "buoyant_kernel", version = "=0.25.1", features = ["internal-api"] }

arrow = "=59.2.0"

arrow-array = "=59.2.0"

arrow-buffer = "=59.2.0"

arrow-schema = "=59.2.0"

arrow-data = "=59.2.0"

arrow-arith = "=59.2.0"

arrow-cast = "=59.2.0"

arrow-csv = "=59.2.0"

arrow-ipc = "=59.2.0"

arrow-ord = "=59.2.0"

arrow-row = "=59.2.0"

arrow-select = "=59.2.0"

arrow-string = "=59.2.0"

arrow-json = "=59.2.0"

parquet = "=59.2.0"

object_store = "=0.13.2"

url = "=2.5.8"

serde_json = "=1.0.151"

bytes = "=1.12.1"
delta_kernel_default_engine = { package = "buoyant_kernel_engine", version = "=0.25.0" }

[features]
datafusion = ["dep:datafusion", "deltalake-core/datafusion"]

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[patch.crates-io]
buoyant_kernel = { path = "../../../../third_party/native/buoyant_kernel" }
buoyant_kernel_engine = { path = "../../../../third_party/native/buoyant_kernel_engine" }
buoyant_kernel_derive = { path = "../../../../third_party/native/buoyant_kernel_derive" }
arrow-json = { path = "../../../../third_party/native/arrow-json" }
parquet = { path = "../../../../third_party/native/parquet" }
arrow-buffer = { path = "../../../../third_party/native/arrow-buffer" }
arrow-schema = { path = "../../../../third_party/native/arrow-schema" }
arrow-data = { path = "../../../../third_party/native/arrow-data" }
arrow-array = { path = "../../../../third_party/native/arrow-array" }
arrow-select = { path = "../../../../third_party/native/arrow-select" }
deltalake = { path = "../../../../third_party/native/delta-rs/crates/deltalake" }
deltalake-core = { path = "../../../../third_party/native/delta-rs/crates/core" }
deltalake-derive = { path = "../../../../third_party/native/delta-rs/crates/derive" }
deltalake-aws = { path = "../../../../third_party/native/delta-rs/crates/aws" }
tokio = { path = "../../../../third_party/native/tokio" }
