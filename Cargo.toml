# Stable CodeFabric daemon and data-plane domain.
#
# The repository intentionally remains one Cargo package and one library crate. The
# nightly rustc extractor is a separate build domain, not a member of a Cargo workspace.

[package]
name = "codefabric"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
resolver = "3"
description = "Stable Rust daemon and data plane for the CodeFabric present-state CPG."
publish = false

[lib]
name = "codefabric"
crate-type = ["rlib"]

[features]
default = ["local-workstation"]
canonical-json = [
    "dep:base64",
    "dep:blake3",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_json_canonicalizer",
    "dep:thiserror",
    "dep:unicode-casefold",
    "dep:unicode-normalization",
]
contract-models = [
    "canonical-json",
    "dep:serde_yaml_ng",
]
model-compiler = [
    "dep:blake3",
    "dep:gix",
    "dep:notify-debouncer-full",
    "dep:petgraph",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_json_canonicalizer",
    "dep:serde_yaml_ng",
    "dep:tempfile",
    "dep:thiserror",
    "dep:toml",
]
provider-inventory-tooling = [
    "dep:ruff_python_ast",
    "dep:serde",
    "dep:serde_json",
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
]
data-fabric = [
    "canonical-json",
    "contract-models",
    "repository-state",
    "dep:async-trait",
    "dep:arrow",
    "dep:arrow-array",
    "dep:arrow-buffer",
    "dep:arrow-cast",
    "dep:arrow-ord",
    "dep:arrow-row",
    "dep:arrow-schema",
    "dep:arrow-select",
    "dep:arrow-string",
    "dep:datafusion",
    "dep:deltalake",
    "dep:futures",
    "dep:object_store",
    "dep:parquet",
    "dep:tracing",
    "dep:tokio",
    "dep:url",
]
fact-generation = [
    "dep:blake3",
    "dep:rayon",
    "dep:ruff_python_ast",
    "dep:ruff_python_index",
    "dep:ruff_python_parser",
    "dep:ruff_python_trivia",
    "dep:ruff_source_file",
    "dep:ruff_text_size",
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:thiserror",
]
rpc = ["dep:prost", "dep:tokio", "dep:tonic", "dep:tonic-prost"]
repository-state = [
    "dep:blake3",
    "dep:gix",
    "dep:rusqlite",
    "dep:rustix",
    "dep:thiserror",
    "dep:url",
]
compatibility-probes = ["canonical-json", "data-fabric", "repository-state", "rpc"]
daemon = [
    "dep:arc-swap",
    "contract-models",
    "data-fabric",
    "fact-generation",
    "repository-state",
    "rpc",
    "dep:notify-debouncer-full",
    "dep:petgraph",
    "dep:toml",
    "dep:tracing",
]
local-workstation = ["daemon", "compatibility-probes"]
proto-tooling = ["dep:prost", "dep:prost-types", "dep:tonic-prost-build"]
s3-storage = ["data-fabric", "deltalake/s3"]

[dependencies]
# FAB §2.1 is the normative alignment baseline. Keep every Arrow type-bearing crate on
# exactly one family; scripts/stable_graph_check.sh validates the resolved graph.
arrow = { version = "=59.2.0", optional = true }
arrow-array = { version = "=59.2.0", optional = true }
arrow-buffer = { version = "=59.2.0", optional = true }
arrow-cast = { version = "=59.2.0", optional = true }
arrow-ord = { version = "=59.2.0", optional = true }
arrow-row = { version = "=59.2.0", optional = true }
arrow-schema = { version = "=59.2.0", optional = true }
arrow-select = { version = "=59.2.0", optional = true }
arrow-string = { version = "=59.2.0", optional = true }
arc-swap = { version = "=1.9.2", optional = true }
async-trait = { version = "=0.1.92", optional = true }
base64 = { version = "=0.22.1", optional = true }
blake3 = { version = "1", optional = true }
datafusion = { version = "=55.0.0", optional = true }
deltalake = { git = "https://github.com/delta-io/delta-rs.git", rev = "43a0cf10a313e5077c48637ad786a05359136bbb", default-features = false, features = ["rustls", "datafusion"], optional = true }
futures = { version = "0.3", optional = true }
gix = { version = "=0.86.0", default-features = false, features = ["sha1", "sha256", "revision", "index", "status", "attributes", "excludes", "dirwalk", "blob-diff", "interrupt", "parallel", "auto-chain-error", "tracing"], optional = true }
notify-debouncer-full = { version = "=0.7.0", optional = true }
object_store = { version = "=0.13.2", optional = true }
parquet = { version = "=59.2.0", features = ["arrow", "async", "object_store"], optional = true }
petgraph = { version = "=0.8.3", default-features = false, features = ["std"], optional = true }
prost = { version = "=0.14.4", optional = true }
prost-types = { version = "=0.14.4", optional = true }
rayon = { version = "=1.12.0", optional = true }
ruff_python_ast = { version = "=0.0.7", optional = true }
ruff_python_index = { version = "=0.0.7", optional = true }
ruff_python_parser = { version = "=0.0.7", optional = true }
ruff_python_trivia = { version = "=0.0.7", optional = true }
ruff_source_file = { version = "=0.0.7", optional = true }
ruff_text_size = { version = "=0.0.7", optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"], optional = true }
rustix = { version = "=1.1.4", features = ["fs"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"], optional = true }
serde_json_canonicalizer = { version = "=0.3.2", optional = true }
serde_yaml_ng = { version = "=0.10.0", optional = true }
tempfile = { version = "=3.27.0", optional = true }
thiserror = { version = "=2.0.20", optional = true }
unicode-casefold = { version = "=0.2.0", optional = true }
unicode-normalization = { version = "=0.1.25", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"], optional = true }
toml = { version = "=1.1.4", default-features = false, features = ["std", "parse", "serde"], optional = true }
tonic = { version = "=0.14.6", features = ["transport"], optional = true }
tonic-prost = { version = "=0.14.6", optional = true }
tonic-prost-build = { version = "=0.14.6", optional = true }
tracing = { version = "0.1", optional = true }
tree-sitter = { version = "=0.26.12", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
hyper-util = { version = "=0.1.20", features = ["tokio"] }
insta = "=1.48.0"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tempfile = "=3.27.0"
tokio-stream = { version = "=0.1.18", features = ["net"] }
tower = { version = "=0.5.3", features = ["util"] }

[package.metadata.cargo-shear]
# `tonic-prost` is referenced by committed generated code, which D-04 keeps outside
# heuristic scanner authority. WP30 and WP31 now consume the complete Tree-sitter and
# Ruff fact-generation stacks directly, so no provider dependency remains ignored.
ignored = [
    "tonic-prost",
]

[[bin]]
name = "codefabric-proto-gen"
path = "tooling/proto/generate.rs"
required-features = ["proto-tooling"]

[[bin]]
name = "codefabric-model"
path = "src/bin/codefabric_model/main.rs"
required-features = ["model-compiler"]

[[bin]]
name = "codefabric-provider-inventory"
path = "tooling/model/provider_inventory.rs"
required-features = ["provider-inventory-tooling"]

[[bin]]
name = "codefabric-model-schema-consumer"
path = "tooling/model/schema_consumer.rs"
required-features = ["data-fabric"]

[[bin]]
name = "codefabricd"
path = "src/bin/codefabricd.rs"
required-features = ["daemon"]

[[bin]]
name = "codefabric"
path = "src/bin/codefabric.rs"
required-features = ["daemon"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = "full"

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
