# Spec section 13: make compiler caching explicit in version control. The repository
# wrapper selects the pinned GHA backend in CI and the supervised per-user UDS service
# locally, including inside Codex's least-privilege sandbox.
#
# Stable root and Pyrefly-sidecar builds intentionally share the repository target
# directory. Cargo fingerprints package, compiler, target, profile, features, and flags;
# incompatible nightly and sanitizer domains select separate target roots in their own
# config or recipes.
#
# sccache remains the mandatory compiler wrapper, but incremental policy is selected at
# the workflow boundary. Repository build/test recipes and CI use CARGO_INCREMENTAL=0 for
# reusable compiler outputs; interactive check/Clippy recipes bypass the wrapper and retain
# native rustc incremental feedback. Ordinary cargo check units omit `link`, and sccache
# 0.17.0 rejects incremental Rust invocations instead of passing them through.
#
# Nothing host-specific belongs here -- service paths and cache sizing are generated by
# scripts/sccache-service.sh rather than committed as Cargo configuration.
[build]
rustc-wrapper = "scripts/sccache-wrapper.sh"
target-dir = "target"
