[package]
name = "codefabric-pyrefly-sidecar"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arrow-array = "=59.2.0"
arrow-ipc = "=59.2.0"
arrow-schema = "=59.2.0"
blake3 = "=1.8.2"
hyper-util = { version = "=0.1.20", features = ["tokio"] }
prost = "=0.14.4"
pyrefly = { version = "=1.2.0", git = "https://github.com/facebook/pyrefly", rev = "1933169ad8ee9e4d4114112eb56ef0811fb0a094", default-features = false }
pyrefly_python = { version = "=1.2.0", git = "https://github.com/facebook/pyrefly", rev = "1933169ad8ee9e4d4114112eb56ef0811fb0a094" }
pyrefly_util = { version = "=1.2.0", git = "https://github.com/facebook/pyrefly", rev = "1933169ad8ee9e4d4114112eb56ef0811fb0a094" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"

[build-dependencies]
blake3 = "=1.8.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
