      - {from: PENDING, event: derivation-unavailable, guard: derivation-terminal, to: UNAVAILABLE_DERIVATION, actions: [record-gap], idempotency_key: capability:derivation, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: PENDING, event: excluded, guard: scope-excluded, to: EXCLUDED, actions: [record-exclusion], idempotency_key: capability:excluded, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: PENDING, event: unsupported, guard: registry-applicability-unsupported, to: UNSUPPORTED, actions: [record-gap], idempotency_key: capability:unsupported, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: PENDING, event: removed, guard: owner-removed, to: REMOVED, actions: [record-removal], idempotency_key: capability:removed, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: PENDING, event: not-applicable, guard: applicability-false, to: NOT_APPLICABLE, actions: [record-applicability], idempotency_key: capability:not-applicable, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: PENDING, event: source-invalidated, guard: source-generation-changed, to: INVALIDATED, actions: [schedule-recompute], idempotency_key: capability:invalidated, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: INVALIDATED, event: recompute-scheduled, guard: owner-present, to: PENDING, actions: [enqueue-owner], idempotency_key: capability:pending, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: INVALIDATED, event: owner-removed, guard: owner-absent, to: REMOVED, actions: [record-removal], idempotency_key: capability:removed, error_on_illegal: STATE_TRANSITION_VIOLATION}
  - machine_id: DurablePublicationState
    version: "1.0"
    states: [{code: 10, name: STAGING, slug: staging, meaning: Staging}, {code: 20, name: VALIDATING, slug: validating, meaning: Validating}, {code: 30, name: VALIDATED, slug: validated, meaning: Validated}, {code: 40, name: COMMITTING, slug: committing, meaning: Committing}, {code: 50, name: COMPLETE, slug: complete, meaning: Complete}, {code: 60, name: FAILED, slug: failed, meaning: Failed}, {code: 70, name: ABANDONED, slug: abandoned, meaning: Abandoned}]
