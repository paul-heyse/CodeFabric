      - {from: VALIDATING, event: validation-failed, guard: terminal-validation-error, to: FAILED, actions: [publish-diagnostic], idempotency_key: publication:failed, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: VALIDATED, event: commit-failed, guard: terminal-storage-error, to: FAILED, actions: [publish-diagnostic], idempotency_key: publication:failed, error_on_illegal: STATE_TRANSITION_VIOLATION}
      - {from: COMMITTING, event: commit-failed, guard: terminal-storage-error, to: FAILED, actions: [publish-diagnostic], idempotency_key: publication:failed, error_on_illegal: STATE_TRANSITION_VIOLATION}
