// artifact_id: codefabric.rpc.cpg-query-service
// artifact_kind: protobuf-schema
// version: 2.0
// compatible_suite_major: 2
// status: released
// canonical_digest: b3:9c6dfae80869040523f1d6de6a9895c45651696d1e9f41e65275c7a608715eaa
