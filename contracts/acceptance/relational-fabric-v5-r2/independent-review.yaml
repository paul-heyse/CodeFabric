  dispositions:
    - claim_id: RFV5-FM4-001
      disposition: accepted
      rationale: The exact suite, stack, protocol, and bridge state are static release authority and do not depend on target output.
    - claim_id: RFV5-FM4-002
      disposition: accepted
      rationale: Modern admission and legacy pre-dispatch rejection are explicit design outcomes with a dispatch-count fault.
    - claim_id: RFV5-FM4-003
      disposition: accepted
      rationale: Catalog observations separate the inert framework advertisement from empty application registries, and the fault uses a valid reverse-DNS extension identifier.
    - claim_id: RFV5-FM4-004
      disposition: accepted
      rationale: The decoded outer schema remains presentation truth while semantic authority and rewrite absence are separately attributed to the Rust daemon.
    - claim_id: RFV5-FM4-005
      disposition: accepted
      rationale: Guard evidence asserts stable daemon ownership, safe presentation, selected-choice equality, and exactly-once admission without freezing a field ID or answer literal.
    - claim_id: RFV5-FM4-006
      disposition: accepted
      rationale: The closed StartQuery variants and pure ValidateQuery path directly encode QRY 13.1 and 13.2.
    - claim_id: RFV5-FM4-007
      disposition: accepted
      rationale: The controlled completion fixture is bounded, authorized, advisory, and revalidated without exposing denied selector classes.
    - claim_id: RFV5-FM4-008
      disposition: accepted
      rationale: The handle literal is controlled fixture input only; expected behavior asserts daemon minting, per-operation authorization, bounds, and no Python lease authority.
    - claim_id: RFV5-FM4-009
      disposition: accepted
      rationale: Cancellation and reconnect assert presence, daemon ownership, and identity equality rather than a fabricated query identifier.
    - claim_id: RFV5-FM4-010
      disposition: accepted
      rationale: Agent-count causality preserves one workspace daemon while isolating per-agent processes, channels, authority, and STDIO streams.
    - claim_id: RFV5-FM4-011
      disposition: accepted
      rationale: The typed denial matrix covers required grant, session, challenge, replay, generation, and bounds failures before bytes or dispatch.
    - claim_id: RFV5-FM4-012
      disposition: accepted
      rationale: Typed public errors remain allowlisted observations and the fault independently exposes secret leakage and STDOUT contamination.
    - claim_id: RFV5-FM4-013
      disposition: accepted
      rationale: The installed adapter census rejects every displaced semantic, session, task, cache, resource, and data-plane authority.
    - claim_id: RFV5-FM4-014
      disposition: accepted
      rationale: Live-scope zero state is distinguished from immutable history, and widening history coverage cannot make history selectable or mutable.
    - claim_id: RFV5-FM4-015
      disposition: accepted
      rationale: The r2 path names a byte-identical inherited preregistration whose control, ordering, sample rules, and budgets remain candidate-neutral.
    - claim_id: RFV5-FM4-016
      disposition: accepted
      rationale: The six-file release and five immutable design inputs are exact independently hashed sets whose drift stops dependent execution.
