  dispositions:
    - claim_id: RFV5-FM4-001
      disposition: accepted
      rationale: The successor suite, pinned stack, protocol era, and daemon bridge are exact static authority observations with a discriminating pin fault.
    - claim_id: RFV5-FM4-002
      disposition: accepted
      rationale: Modern admission and typed legacy pre-dispatch rejection distinguish adapter admission from Rust business dispatch.
    - claim_id: RFV5-FM4-003
      disposition: accepted
      rationale: The exact catalog preserves the permitted empty framework UI advertisement while rejecting application extension drift.
    - claim_id: RFV5-FM4-004
      disposition: accepted
      rationale: Public outer schemas are exact presentation observations while semantic request authority and absence of adapter rewrites remain daemon-owned.
    - claim_id: RFV5-FM4-005
      disposition: accepted
      rationale: The guarded-input relation proves daemon-owned fields and choices, safe presentation, selected-choice equality, and exactly-once resumed admission without runtime literals.
    - claim_id: RFV5-FM4-006
      disposition: accepted
      rationale: ValidateQuery purity and the closed StartQuery outcome relation encode atomic start and reject hidden adapter retry or business dispatch.
    - claim_id: RFV5-FM4-007
      disposition: accepted
      rationale: Completion remains bounded, advisory, selector-authorized, and subject to authoritative daemon revalidation.
    - claim_id: RFV5-FM4-008
      disposition: accepted
      rationale: Resource handles stay daemon-minted and operation-authorized, bounded reads remain exact, and no adapter lease authority is introduced.
    - claim_id: RFV5-FM4-009
      disposition: accepted
      rationale: Cancellation is forwarded once and reconnect resumes the accepted daemon-owned query identity without resubmission.
    - claim_id: RFV5-FM4-010
      disposition: accepted
      rationale: Agent-count causality preserves one workspace daemon while isolating per-agent processes, channels, principals, and STDIO streams.
    - claim_id: RFV5-FM4-011
      disposition: accepted
      rationale: Logical input capacity is separated from transport decode capacity; an invalid requested maximum maps to INVALID_ARGUMENT plus SAFE_ERROR_CODE_INVALID_REQUEST, while an offset past resource extent maps to OUT_OF_RANGE plus SAFE_ERROR_CODE_RANGE_NOT_SATISFIABLE, and the fault swaps both typed pairs before bytes or dispatch.
    - claim_id: RFV5-FM4-012
      disposition: accepted
      rationale: Public errors remain typed and allowlisted, with independent mismatch paths for secret leakage, unsafe text, and STDOUT contamination.
    - claim_id: RFV5-FM4-013
      disposition: accepted
      rationale: The adapter census excludes independent semantic, session, task, cache, resource, and data-plane authority.
    - claim_id: RFV5-FM4-014
      disposition: accepted
      rationale: Live-scope zero state is distinct from immutable predecessor history, which remains neither selectable nor mutable.
    - claim_id: RFV5-FM4-015
      disposition: accepted
      rationale: The r3 registration uses the active path while the method remains byte-identical to r1 and candidate-neutral in controls, ordering, samples, and budgets.
    - claim_id: RFV5-FM4-016
      disposition: accepted
      rationale: The six artifacts and eight immutable inputs are exact hash-bound sets, the review binds the immutable candidate commit, and drift fails closed.
