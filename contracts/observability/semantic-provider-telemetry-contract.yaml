artifact_id: codefabric.observability.semantic-provider-telemetry
artifact_kind: contract
version: "1.0"
compatible_suite_major: 1
status: released
label_policy:
  bounded_labels: [provider_id, provider_phase, terminal_state, failure_code]
  forbidden_labels: [workspace_id, analysis_context_id, provider_run_id, source_path, diagnostic_text]
  provider_ids: [ruff-python, pyrefly-python, rustc-mir]
phases:
  - admission
  - binding-pass
  - traversal-pass
  - child-launch
  - handshake
  - stage-creation
  - chunk-write
  - chunk-accept
  - chunk-reject
  - terminal-verification
  - cancellation
  - kill
  - cleanup
  - journal-transition
metrics:
  - {name: provider_phase, value_kind: code, unit: code, lifecycle: provider-run, cardinality: bounded-phase}
  - {name: input_bytes, value_kind: counter, unit: bytes, lifecycle: provider-run, cardinality: per-provider}
  - {name: output_bytes, value_kind: counter, unit: bytes, lifecycle: provider-run, cardinality: per-provider}
  - {name: memory_high_water, value_kind: gauge, unit: bytes, lifecycle: provider-run, cardinality: per-provider}
  - {name: queue_depth, value_kind: gauge, unit: jobs, lifecycle: runtime-sample, cardinality: per-provider}
  - {name: chunk_count, value_kind: counter, unit: chunks, lifecycle: provider-run, cardinality: per-provider}
  - {name: cache_hits, value_kind: counter, unit: entries, lifecycle: provider-run, cardinality: per-provider}
  - {name: cancellation_count, value_kind: counter, unit: requests, lifecycle: provider-run, cardinality: per-provider}
  - {name: visited_node_count, value_kind: counter, unit: nodes, lifecycle: provider-run, cardinality: per-provider}
  - {name: scope_count, value_kind: gauge, unit: scopes, lifecycle: provider-run, cardinality: per-provider}
  - {name: binding_count, value_kind: gauge, unit: bindings, lifecycle: provider-run, cardinality: per-provider}
  - {name: reference_count, value_kind: gauge, unit: references, lifecycle: provider-run, cardinality: per-provider}
  - {name: unresolved_reference_count, value_kind: gauge, unit: references, lifecycle: provider-run, cardinality: per-provider}
  - {name: failure_count, value_kind: counter, unit: failures, lifecycle: provider-run, cardinality: bounded-failure-code}
  - {name: wall_time, value_kind: histogram, unit: microseconds, lifecycle: provider-run, cardinality: per-provider}
resource_profiles:
  ruff-python: in-process-syntax-standard
  pyrefly-python: sidecar-semantic-standard
  rustc-mir: compiler-semantic-standard
owner_acceptance:
  approver: fact-generation-owner
  accepted_at: "2026-08-26"
  construction_rule: GI-15 bounded semantic provider telemetry with declared units, lifecycle, and cardinality
