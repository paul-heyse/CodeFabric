id: ontology-global-result-version-forbidden
language: Rust
severity: error
message: Serving result/checksum version must come from the lease-pinned ontology program.
files:
  - src/**/*.rs
rule:
  any:
    - all:
        - kind: identifier
        - regex: '^RESULT_CHECKSUM_VERSION$'
    - pattern: $AUTHORITY.map_or("ResultChecksumV2", $$$REST)
    - pattern: $AUTHORITY.unwrap_or("ResultChecksumV2")
    - pattern: $AUTHORITY.unwrap_or_else(|| "ResultChecksumV2")
