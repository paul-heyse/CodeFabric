id: domain-conformance-exhaustive
language: Rust
severity: error
message: ID-domain Expr and LogicalPlan transitions must never use an accepting wildcard arm.
note: Exhaustive matching is the compile-time dependency-drift alarm for the pinned DataFusion enums.
files:
  - src/domain_conformance.rs
rule:
  all:
    - kind: match_arm
    - regex: '^\s*_\s*=>'
