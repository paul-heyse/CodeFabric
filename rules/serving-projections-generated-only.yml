id: serving-projections-generated-only
language: Rust
severity: error
message: Serving and control projection topology must come from generated Contract IR.
note: Add projection records to schema-contract-ir.json and regenerate; do not add runtime crosswalks.
files:
  - src/fabric/serving.rs
rule:
  any:
    - pattern: "const CONTROL_TABLES: $TYPE = $VALUE;"
    - all:
        - kind: array_expression
        - regex: '\((100|110|120|130),\s*"(entities|relations|properties|evidence)"\)'
