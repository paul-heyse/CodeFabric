id: authoritative-source-read-boundary
language: Rust
severity: error
message: Authoritative source bytes must be read through secure_path.
note: Configuration, contract, database, entropy, and Git-advisory boundaries are explicitly non-source readers.
files:
  - src/**/*.rs
ignores:
  - src/secure_path.rs
  - src/daemon.rs
  - src/identity.rs
  - src/operational_store.rs
  - src/contracts/**/*.rs
  # These modules inspect daemon-owned table state, never live workspace source.
  - src/fabric/delta_commit_reconciliation.rs
  - src/fabric/delta_semantic_read.rs
  - src/fabric/delta_write.rs
  # Host-containment probes and private compiler artifacts are operational inputs,
  # not source-authority reads.
  - src/provider_sandbox.rs
  - src/rust_compilation_trust.rs
rule:
  all:
    - any:
        - pattern: std::fs::read($PATH)
        - pattern: fs::read($PATH)
        - pattern: tokio::fs::read($PATH)
        - pattern: std::fs::read_to_string($PATH)
        - pattern: fs::read_to_string($PATH)
        - pattern: tokio::fs::read_to_string($PATH)
        - pattern: std::fs::File::open($PATH)
        - pattern: fs::File::open($PATH)
        - pattern: File::open($PATH)
        - pattern: std::fs::OpenOptions::new()
        - pattern: fs::OpenOptions::new()
        - pattern: OpenOptions::new()
    - not:
        inside:
          any:
            # Provider launchers receive only securely captured, content-addressed source blobs.
            - pattern: 'fn read_immutable_blob($INPUT: &PyreflyModuleInput) -> Result<AdmittedImmutableBlob, PyreflyServiceError> { $$$BODY }'
            # Provider views read back daemon-owned immutable copies and manifests after
            # secure source capture; they never reopen the live workspace.
            - pattern: 'pub fn publish_provider_workspace_view($$$ARGS) -> Result<ProviderWorkspaceView, SourceImageError> { $$$BODY }'
            - pattern: 'fn write_immutable_file($PATH: &Path, $BYTES: &[u8], $MODE: u32) -> Result<(), SourceImageError> { $$$BODY }'
            - pattern: 'fn verify_published_provider_tree($ROOT: &Path, $ENTRIES: &[(ProviderWorkspaceManifestEntry, Arc<[u8]>)]) -> Result<(), SourceImageError> { $$$BODY }'
            # Host probes and profile materialization inspect only temporary probe output
            # and daemon-owned sandbox profiles.
            - pattern: 'fn probe_darwin_seatbelt() -> SandboxProbeObservation { $$$BODY }'
            - all:
                - kind: impl_item
                - has:
                    kind: type_identifier
                    regex: '^GeneratedSandboxProfile$'
                    stopBy: end
            # The provider fixture reads the committed extractor toolchain identity.
            - pattern: 'async fn run_rustc($$$ARGS) -> Result<AcceptedRustcCompilation, ProviderFixtureError> { $$$BODY }'
            # ResultArtifactStore owns private daemon artifacts below its configured state root.
            - all:
                - kind: impl_item
                - has:
                    kind: type_identifier
                    regex: '^ResultArtifactStore$'
                    stopBy: end
          stopBy: end
