id: governed-datafusion-ingress-only
language: Rust
severity: error
message: Production query planning and execution must cross GovernedSession and GovernedPlan.
note: The explicit migration-file exemptions are removed with DB08 in WP26; no new caller may bypass the sealed adapter.
files:
  - src/**/*.rs
ignores:
  - src/governed_session.rs
  - src/domain_conformance.rs
  - src/ontology_gate.rs
  - src/compatibility.rs
  - src/core_facts.rs
  - src/fabric.rs
  - src/fabric/**/*.rs
  - src/ontology_activation.rs
  - src/ontology_executor.rs
  - src/ontology_rules.rs
rule:
  any:
    - all:
        - kind: call_expression
        - regex: 'SessionContext::new(?:_with_(?:config|config_rt|state))?\s*\('
    - all:
        - kind: call_expression
        - regex: '(?:create_physical_plan|execute_logical_plan|query_planner)\s*\('
    - all:
        - kind: call_expression
        - regex: 'SessionStateBuilder::new\s*\('
    - all:
        - kind: scoped_identifier
        - regex: '^LogicalPlan::Analyze$'
