id: ontology-activation-fastmcp-forbidden
language: Python
severity: error
message: The FastMCP presentation adapter must not expose ontology activation or rollback.
files:
  - codefabric-cpg-mcp/**/*.py
rule:
  all:
    - kind: function_definition
    - has:
        field: name
        regex: '(?i)(?:activate|rollback).*ontology|ontology.*(?:activate|rollback)'
