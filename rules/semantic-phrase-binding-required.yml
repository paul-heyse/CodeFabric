id: semantic-phrase-binding-required
language: Rust
severity: error
message: Runtime semantic phrase behavior must not dispatch on handwritten phrase or contract strings.
note: Phrase IDs and projection operands are decoded from the Arrow ontology program.
files:
  - src/semantic_query.rs
  - src/ontology_rules.rs
rule:
  any:
    - pattern: match $P.phrase_id.as_str() { $$$ARMS }
    - pattern: match $P.contract_code.as_str() { $$$ARMS }
    - pattern: match $P.canonical_text.as_str() { $$$ARMS }
