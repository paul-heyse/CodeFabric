id: release-compiler-inward-boundary-only
language: Rust
severity: error
message: release compiler may depend only on application contracts and minimal Arrow values.
note: Keep providers, DataFusion, Delta, repository/state, RPC, supervisor, and generated transport outside this boundary.
files:
  - src/semantic_release.rs
rule:
  all:
    - kind: use_declaration
    - regex: "(datafusion|deltalake|gix|rusqlite|tonic|prost|tokio|tree_sitter|ruff_|crate::(daemon|fabric|rpc|supervisor|production_provider_recipe|pyrefly_service|rustc_service))"
    - not:
        inside:
          pattern: "mod tests { $$$BODY }"
          stopBy: end
