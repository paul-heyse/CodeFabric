id: deltalake-boundary-only
language: Rust
severity: error
message: delta-rs types and functions belong only in the fabric boundary.
note: Convert delta-rs values to application-owned DTOs before returning across the boundary.
files:
  - src/**/*.rs
ignores:
  - src/fabric.rs
rule:
  any:
    - all:
        - kind: scoped_identifier
        - regex: "^deltalake::"
    - all:
        - kind: scoped_type_identifier
        - regex: "^deltalake::"
    - all:
        - kind: use_declaration
        - regex: "(^|\\s)deltalake::"
