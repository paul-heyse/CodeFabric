id: deltalake-boundary-only
language: Rust
severity: error
message: delta-rs reader and writer capabilities belong only in the fabric boundary.
note: Keep Delta mutation handles private and return application-owned DTOs or read-only providers.
files:
  - src/**/*.rs
ignores:
  - src/fabric.rs
  - src/fabric/**/*.rs
rule:
  any:
    - all:
        - kind: scoped_identifier
        - regex: "^deltalake::"
    - all:
        - kind: scoped_type_identifier
        - regex: "^deltalake::"
    - all:
        - kind: use_declaration
        - regex: "(^|\\s)deltalake::"
