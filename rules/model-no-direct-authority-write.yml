id: model-no-direct-authority-write
language: Rust
severity: error
message: Model drivers and promoted consumers may write only through the staged DesiredTree capability.
note: Authorities, KATs, fixtures, and owner acceptances are never routine driver outputs.
files:
  - tooling/model-transition/consumer-overlays/**/*.rs
  - tooling/model-transition/live/**/*.rs
rule:
  any:
    - all:
        - kind: call_expression
        - regex: '(fs::write|std::fs::write|File::create|OpenOptions::open).*"(contracts/(acceptance|fixtures)|docs/upfront_design)/'
    - all:
        - kind: macro_invocation
        - regex: '(write|writeln)!.*"(contracts/(acceptance|fixtures)|docs/upfront_design)/'
