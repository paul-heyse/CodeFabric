id: ontology-candidate-session-sealed
language: Rust
severity: error
message: Candidate validation must use its single caller-supplied GovernedSession.
note: Default or caller-created DataFusion sessions split resource, analyzer, and policy identity.
files:
  - src/ontology_candidate.rs
  - src/ontology_rules.rs
  - src/fabric/publication.rs
rule:
  any:
    - pattern: SessionContext::new($$$ARGS)
    - pattern: SessionContext::new_with_config($$$ARGS)
    - pattern: SessionContext::new_with_config_rt($$$ARGS)
    - pattern: SessionStateBuilder::new($$$ARGS)
