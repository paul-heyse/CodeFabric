id: semantic-code-literal-forbidden
language: Rust
severity: error
message: Semantic predicate and program construction must not embed bare numeric ontology codes.
note: Codes must be resolved from typed Arrow program operands or the ontology vocabulary.
files:
  - src/semantic_query.rs
  - src/ontology_executor.rs
  - src/ontology_rules.rs
rule:
  any:
    - pattern: ScalarValue::Int16(Some($VALUE))
    - pattern: ScalarValue::Int32(Some($VALUE))
constraints:
  VALUE:
    regex: '^[-]?[0-9][0-9_]*$'
