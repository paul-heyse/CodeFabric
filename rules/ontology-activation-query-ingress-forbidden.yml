id: ontology-activation-query-ingress-forbidden
language: Rust
severity: error
message: Query and semantic RPC surfaces must not expose ontology activation commands.
files:
  - src/semantic_query.rs
  - src/rpc.rs
  - src/rpc/**/*.rs
rule:
  any:
    - all:
        - kind: identifier
        - regex: '(?i)^(?:activate|rollback).*ontology|ontology.*(?:activate|rollback)$'
    - all:
        - kind: string_literal
        - regex: '(?i)(?:activate|rollback)[-_ ]*ontology|ontology[-_ ]*(?:activate|rollback)'
