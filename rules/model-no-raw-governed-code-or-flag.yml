id: model-no-raw-governed-code-or-flag
language: Rust
severity: error
message: Governed occurrence codes and persisted provider flags require generated typed accessors.
note: Numeric allocations live in enum/flag authorities and are projected by the model driver.
files:
  - src/source_syntax.rs
rule:
  any:
    - all:
        - kind: field_initializer
        - regex: 'occurrence_family_code\s*:\s*(0x[0-9A-Fa-f_]+|[0-9][0-9_]*)'
    - all:
        - kind: field_initializer
        - regex: 'provider_node_flags\s*:\s*(0x[0-9A-Fa-f_]+|[0-9][0-9_]*|[^,}]*(<<|\|))'
    - all:
        - kind: const_item
        - regex: 'OCCURRENCE_[A-Z_]+\s*:\s*u16\s*=\s*[0-9]'
