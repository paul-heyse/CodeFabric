id: ontology-raw-planner-sealed
language: Rust
severity: error
message: Ontology and semantic-query callers must not access raw optimizer, planner, or Analyze paths.
note: Only the sealed adapter and once-only gate executor own DataFusion physical planning.
files:
  - src/ontology_candidate.rs
  - src/ontology_executor.rs
  - src/ontology_rules.rs
  - src/ontology_activation.rs
  - src/semantic_query.rs
  - src/snapshot_runtime.rs
rule:
  any:
    - pattern: $CTX.state().optimize($PLAN)
    - pattern: $CTX.state().create_physical_plan($PLAN)
    - pattern: $CTX.execute_logical_plan($PLAN)
    - all:
        - kind: scoped_identifier
        - regex: '^LogicalPlan::Analyze$'
    - all:
        - kind: string_literal
        - regex: 'EXPLAIN\s+ANALYZE'
    - all:
        - kind: identifier
        - regex: '^AnalyzeExec$'
