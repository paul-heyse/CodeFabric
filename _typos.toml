# Spelling and identifier hygiene (spec section 17).
#
# Misspellings are not merely cosmetic here: a wrong word in a serialized field, an
# exception name, or a public Python symbol becomes an API defect. So source, snapshots,
# error messages, and stubs are deliberately NOT excluded.

[files]
extend-exclude = [
  "target/",
  "dist/",
  ".venv/",
  "fuzz/corpus/",
  "fuzz/artifacts/",
  "contracts/generated/",
  "src/generated/",
  "codefabric-cpg-mcp/src/codefabric_cpg_mcp/daemon/generated/",
  "rustc-extractor/src/generated/",
  "pyrefly-sidecar/src/generated/",
  # ~9 MB of third-party-derived library reference prose. Not our vocabulary to correct,
  # and large enough to bury real findings. docs/authoritative_design/ is ours and stays in.
  "docs/library_ref/",
  # Immutable v1 planning history contains deliberately quoted citation placeholders and a
  # mixed-case SQL-nullability mnemonic. WP73's superseding detector-backed v2 review replaces
  # them as execution authority; excluding these two exact files avoids rewriting history while
  # keeping all active plans, reviews, state, source, and contracts checked.
  "docs/plans/codefabric_design_principles_full_alignment_implementation_plan_v1_2026-08-24.md",
  "docs/reviews/design_principles_remediation_proposal_2026-08-24_v1.md",
]

[default]
# Generated requirement identifiers are opaque content digests. Their hexadecimal substrings are
# not prose and must never be rewritten to satisfy spelling heuristics.
extend-ignore-re = ["MODEL-[0-9a-f]+"]

[default.extend-words]
# Genuine project/domain vocabulary only. Prefer a narrow word exception here over
# excluding a whole directory. Seed this from real `typos` findings, not from guesses.
#
# Each entry needs a reason. Adding every finding to the dictionary to get a green run is
# an anti-pattern (tooling-ref section 72.5).

# A valid English variant, and the ontology uses it as a field name alongside `read_only`
# (fact-ontology spec, "class member status"). Rewriting it to "writable" would be an
# identifier change to the fact contract, not a spelling fix.
writeable = "writeable"

# The design corpus quotes abbreviated git SHAs (delta-rs revisions, upstream commit
# ranges). `typos` reads the hex as words: `3b1734ba` -> "ba" -> "by"/"be". These are
# identities, not prose, and correcting one would falsify a citation.
ba = "ba"

# "mis-attribution", "mis-cited". A standard English prefix that `typos` splits on the
# hyphen and then reports as a misspelling of "miss"/"mist".
mis = "mis"

# rustix mirrors the POSIX `O_WRONLY` flag as `OFlags::WRONLY`. This is an upstream API
# identifier, not prose and not a misspelling we can rename.
WRONLY = "WRONLY"

# gix-dir names its byte-native repository-relative path field `rela_path`.
# This is a pinned upstream public API identifier and cannot be renamed locally.
rela = "rela"
