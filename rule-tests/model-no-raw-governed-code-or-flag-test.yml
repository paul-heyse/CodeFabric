id: model-no-raw-governed-code-or-flag
valid:
  - |
      fn row() -> SyntaxDetailRow {
          SyntaxDetailRow {
              occurrence_family_code: OccurrenceFamily::Syntax as u16,
              provider_node_flags: ProviderNodeFlags::empty(),
          }
      }
invalid:
  - |
      fn row() -> Input {
          Input { occurrence_family_code: 30 }
      }
  - |
      fn row() -> SyntaxDetailRow {
          SyntaxDetailRow { provider_node_flags: 1 << 4 }
      }
  - |
      const OCCURRENCE_SYNTAX: u16 = 30;
