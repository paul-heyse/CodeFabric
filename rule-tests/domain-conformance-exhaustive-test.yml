id: domain-conformance-exhaustive
valid:
  - |
      fn validate(expr: Expr) -> Result<()> {
          match expr {
              Expr::Column(_) => Ok(()),
              Expr::Literal(_, _) => Ok(()),
          }
      }
invalid:
  - |
      fn validate(expr: Expr) -> Result<()> {
          match expr {
              Expr::Column(_) => Ok(()),
              _ => Ok(()),
          }
      }
