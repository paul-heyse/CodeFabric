id: governed-datafusion-ingress-only
valid:
  - |
      async fn gate(session: &GovernedSession, plan: GovernedPlan) {
          session.execute_gate(&plan, "execution", "candidate", "action", &limits).await;
      }
invalid:
  - |
      fn bypass() {
          let context = SessionContext::new();
      }
  - |
      async fn bypass(context: &SessionContext, plan: &LogicalPlan) {
          context.state().create_physical_plan(plan).await;
      }
  - |
      fn bypass() {
          let state = SessionStateBuilder::new().with_default_features().build();
      }
  - |
      fn bypass(plan: LogicalPlan) {
          if let LogicalPlan::Analyze(node) = plan { consume(node); }
      }
