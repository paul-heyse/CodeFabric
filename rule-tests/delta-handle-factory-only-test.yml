id: delta-handle-factory-only
valid:
  - |
      async fn open(factory: DeltaHandleFactory) {
          factory.open(uri, version, DeltaAccessProfile::QueryServing).await;
      }
invalid:
  - |
      async fn open(uri: Url) {
          DeltaTableBuilder::from_url(uri).unwrap().load().await;
      }
