id: semantic-phrase-binding-required
valid:
  - |
      fn lower(compiler: &OntologyProgramCompiler, phrase: &ResolvedPhrase) {
          compiler.query_projection_codes.get(&(phrase.phrase_id.clone(), "entity_kind".into()));
      }
invalid:
  - |
      fn lower(phrase: &ResolvedPhrase) {
          match phrase.phrase_id.as_str() {
              "Q51_SYNTAX_NODES" => syntax(),
              _ => none(),
          }
      }
