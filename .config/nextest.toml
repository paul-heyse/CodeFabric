# cargo-nextest profiles (spec section 18).
#
# nextest does NOT run doctests. `cargo test --doc` is a separate, mandatory step; never
# report "all Rust tests passed" from nextest alone (spec sections 18.2 and 62.2).

[profile.default]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
fail-fast = false
# Retries are diagnostic, not a way to make a red test disappear. `flaky-result = "fail"`
# means a test that only passes on rerun still fails the build (spec section 18.1).
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s", jitter = true }
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 3 }
global-timeout = "2h"
success-output = "never"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# AC-G-79 deliberately creates and reopens independent Delta publications for every
# released terminal scenario. Keep the ordinary 60-second slow-test signal, but allow
# this one dedicated assurance oracle to finish instead of treating its expected I/O as
# a hung unit test.
[[profile.default.overrides]]
filter = 'test(full_golden_scenario_clean_rebuild_equivalence)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(full_golden_scenario_clean_rebuild_equivalence)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The Gate B vertical and its causal interventions compile real nightly Rust owners,
# execute a real Pyrefly sidecar, publish Delta tables, and cross daemon plus locked
# STDIO process boundaries. Retain one-minute slow signals while allowing those bounded
# semantic oracles to complete under aggregate-suite contention.
[[profile.default.overrides]]
filter = 'test(gate_b_vertical_slice_produces_all_eleven_planes) | test(gate_b_vertical_slice_adversarial) | test(gate_b_candidate_operational_gate) | test(gate_b_causal_intervention_matrix) | test(gate_b_named_fixture_query_causality)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(gate_b_vertical_slice_produces_all_eleven_planes) | test(gate_b_vertical_slice_adversarial) | test(gate_b_candidate_operational_gate) | test(gate_b_causal_intervention_matrix) | test(gate_b_named_fixture_query_causality)'
slow-timeout = { period = "60s", terminate-after = 10 }

# When tests come to share a database, port, or other scarce resource, constrain them
# with a test group rather than serializing the whole suite (spec section 18.3):
#
#   [test-groups.database]
#   max-threads = 1
#
#   [[profile.default.overrides]]
#   filter = 'test(database_)'
#   test-group = 'database'
