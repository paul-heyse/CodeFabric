[profile.ci]
fail-fast = false
# Retries are diagnostic, not a way to make a red test disappear. `flaky-result = "fail"`
# means a test that only passes on rerun still fails the build (spec section 18.1).
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s", jitter = true }
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 3 }
global-timeout = "2h"
success-output = "never"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# AC-G-79 deliberately creates and reopens independent Delta publications for every
# released terminal scenario. Keep the ordinary 60-second slow-test signal, but allow
# this one dedicated assurance oracle to finish instead of treating its expected I/O as
# a hung unit test.
[[profile.default.overrides]]
filter = 'test(full_golden_scenario_clean_rebuild_equivalence)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(full_golden_scenario_clean_rebuild_equivalence)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Real workspaces share the user's inotify instances and substantial durable I/O.
# nextest runs each test in a separate process; a Rust mutex cannot admit these fixtures.
# Keep ordinary library/wire/graph tests parallel and preserve production worker budgets.
[test-groups.native-workspaces]
max-threads = 2

[[profile.default.overrides]]
filter = 'test(integration::daemon::) | test(daemon::tests::wp47_fresh_production_workspace_prepares_exact_and_guarded_semantic_requests) | test(fabric::workspace_updates::tests::native_watch) | test(fabric::workspace_updates::tests::poll_watch) | test(fabric::workspace_updates::tests::owned_watch) | test(fabric::workspace_updates::tests::explicit_poll_watch) | test(rt_cpg_wp79_complete_ten_thousand_file_governed_capture)'
test-group = 'native-workspaces'

# A complete durable capture uses both slots to avoid concurrent daemon startup I/O.
[[profile.default.overrides]]
filter = 'test(rt_cpg_wp79_complete_ten_thousand_file_governed_capture)'
threads-required = 2

# Live/clean comparisons keep two complete daemons alive inside one test. The first
# aggregate admitted four daemons together and interrupted the final clean comparison
# at 900s. The full first-release corpus also exhausted publication time while overlapping
# another native corpus. Give these scenarios the complete fixture allowance; ordinary
# watcher checks and single-workspace scenarios still share the group where admitted.
[[profile.default.overrides]]
filter = 'test(integration::daemon::live_updates::) | test(integration::daemon::first_release::)'
threads-required = 2

# Repeated public blocks include provider convergence, installed clients and exact reopen.
# The unchanged sequential baseline takes 101.742s; leave bounded room for admitted overlap.
# Direct backend execution now explicitly waits for semantic-current admission before reading.
[[profile.default.overrides]]
filter = 'test(block_queries::) | test(daemon::tests::wp47_fresh_production_workspace_prepares_exact_and_guarded_semantic_requests)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(block_queries::) | test(daemon::tests::wp47_fresh_production_workspace_prepares_exact_and_guarded_semantic_requests)'
slow-timeout = { period = "60s", terminate-after = 5 }

