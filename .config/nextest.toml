# cargo-nextest profiles (spec section 18).
#
# nextest does NOT run doctests. `cargo test --doc` is a separate, mandatory step; never
# report "all Rust tests passed" from nextest alone (spec sections 18.2 and 62.2).

# Live/clean edit cases now execute separate source and semantic publications. The full
# diagnostic run reached final clean work at 900s (mixed functions), while two-edit Python
# cases exhausted 300s midway through their five publication cycles. Keep finite envelopes
# for the complete sequences, including their installed-client queries and joined teardown.
[profile.default]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 2 }

# Independent Cargo targets include source/semantic publication and installed public queries.
# Keep a finite scenario hang bound without imposing a two-minute performance requirement.
[[profile.default.overrides]]
filter = 'test(pragmatic_rust_target_failure_retains_other_targets)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(pragmatic_rust_target_failure_retains_other_targets)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'test(live_mixed_function_definitions_and_bodies_equal_exact_clean_source)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.ci.overrides]]
filter = 'test(live_mixed_function_definitions_and_bodies_equal_exact_clean_source)'
slow-timeout = { period = "60s", terminate-after = 20 }

