# cargo-nextest profiles (spec section 18).
#
# nextest does NOT run doctests. `cargo test --doc` is a separate, mandatory step; never
# report "all Rust tests passed" from nextest alone (spec sections 18.2 and 62.2).

[profile.default]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'test(live_mixed_function_definitions_and_bodies_equal_exact_clean_source)'
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'test(live_mixed_function_definitions_and_bodies_equal_exact_clean_source)'
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'test(live_mixed_function_definitions_and_bodies_equal_exact_clean_source) | test(live_mixed_decoded_sources_equal_original_bytes_and_independent_clean_queries) | test(source_line_windows_and_hard_limits_survive_public_delivery_and_reopen) | test(mixed_raw_path_inventory_keeps_rust_calls_across_updates_and_clean_reopen) | test(custom_cargo_build_input_changes_context_and_matches_clean_public_results) | test(cargo_configured_platforms_and_flags_converge_with_clean_public_queries) | test(cargo_library_linkage_kinds_survive_live_queries_and_clean_reopen) | test(cargo_feature_and_profile_selections_keep_partial_contexts_and_equal_clean_queries)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(live_mixed_function_definitions_and_bodies_equal_exact_clean_source) | test(live_mixed_decoded_sources_equal_original_bytes_and_independent_clean_queries) | test(source_line_windows_and_hard_limits_survive_public_delivery_and_reopen) | test(mixed_raw_path_inventory_keeps_rust_calls_across_updates_and_clean_reopen) | test(custom_cargo_build_input_changes_context_and_matches_clean_public_results) | test(cargo_configured_platforms_and_flags_converge_with_clean_public_queries) | test(cargo_library_linkage_kinds_survive_live_queries_and_clean_reopen) | test(cargo_feature_and_profile_selections_keep_partial_contexts_and_equal_clean_queries)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'test(live_python_raw_paths_and_root_initializer_keep_exact_source_identity)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(live_python_raw_paths_and_root_initializer_keep_exact_source_identity)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(live_python_search_paths_preserve_all_sources_and_equal_independent_clean_queries)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(live_python_search_paths_preserve_all_sources_and_equal_independent_clean_queries)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(live_python_namespace_stub_precedence_equals_independent_clean_queries)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(live_python_namespace_stub_precedence_equals_independent_clean_queries)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(live_python_context_and_negative_imports_equal_independent_clean_queries)'
slow-timeout = { period = "60s", terminate-after = 30 }

[[profile.ci.overrides]]
filter = 'test(live_python_context_and_negative_imports_equal_independent_clean_queries)'
slow-timeout = { period = "60s", terminate-after = 30 }

[[profile.default.overrides]]
filter = 'test(processing_remainder_pages_keep_exact_scope_across_reopen_and_updates)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(processing_remainder_pages_keep_exact_scope_across_reopen_and_updates)'
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
# Retries are diagnostic, not a way to make a red test disappear. `flaky-result = "fail"`
# means a test that only passes on rerun still fails the build (spec section 18.1).
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s", jitter = true }
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 3 }
global-timeout = "2h"
success-output = "never"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# AC-G-79 deliberately creates and reopens independent Delta publications for every
# released terminal scenario. Keep the ordinary 60-second slow-test signal, but allow
# this one dedicated assurance oracle to finish instead of treating its expected I/O as
# a hung unit test.
[[profile.default.overrides]]
filter = 'test(full_golden_scenario_clean_rebuild_equivalence)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(full_golden_scenario_clean_rebuild_equivalence)'
slow-timeout = { period = "60s", terminate-after = 10 }

# When tests come to share a database, port, or other scarce resource, constrain them
# with a test group rather than serializing the whole suite (spec section 18.3):
#
#   [test-groups.database]
#   max-threads = 1
#
#   [[profile.default.overrides]]
#   filter = 'test(database_)'
#   test-group = 'database'

# This scenario runs four public forms across edits, failure and repair and independent clean
# Rust/Python provider builds. The ordinary two-minute bound interrupts expected work.
[[profile.default.overrides]]
filter = 'test(mixed_live_updates_equal_independent_clean_public_queries)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(mixed_live_updates_equal_independent_clean_public_queries)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Multiple paused semantic updates plus exact restart exercise owned recovery in one daemon.
[[profile.default.overrides]]
filter = 'test(source_current_publication_fences_delayed_semantics_and_resumes_after_restart)'
slow-timeout = { period = "60s", terminate-after = 15 }

# The complete Python edit sequence now publishes source and semantic successors.
[[profile.default.overrides]]
filter = 'test(pragmatic_live_python_edits_converge_without_restart)'
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'test(pragmatic_live_python_edits_converge_without_restart)'
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'test(source_current_publication_fences_delayed_semantics_and_resumes_after_restart)'
slow-timeout = { period = "60s", terminate-after = 15 }

# This mixed native scenario executes 70 installed-client blocks across exact reopen,
# including authorized source materialization. Literal/filter scenarios also install the real
# native stack and reopen it. Source authorization additionally revokes a retained page and
# waits for a source/semantic successor before reading old bytes. Keep a finite outer bound.
[[profile.default.overrides]]
filter = 'test(first_release::) | test(relationship_queries::) | test(pragmatic_literal_identifiers_and_property_filters_survive_public_reopen) | test(pragmatic_source_boundaries_narrow_first_four_forms_and_survive_reopen) | test(fact_families::) | test(pragmatic_syntax_nodes_properties_parents_and_source_survive_public_reopen) | test(location_queries::) | test(ordering_queries::) | test(branch_queries::) | test(pragmatic_public_source_context_is_exact_and_separately_authorized)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(first_release::) | test(relationship_queries::) | test(pragmatic_literal_identifiers_and_property_filters_survive_public_reopen) | test(pragmatic_source_boundaries_narrow_first_four_forms_and_survive_reopen) | test(fact_families::) | test(pragmatic_syntax_nodes_properties_parents_and_source_survive_public_reopen) | test(location_queries::) | test(ordering_queries::) | test(branch_queries::) | test(pragmatic_public_source_context_is_exact_and_separately_authorized)'
slow-timeout = { period = "60s", terminate-after = 5 }

# Explicit PollWatcher deployment profile through installed source queries and exact reopen.
[[profile.default.overrides]]
filter = 'test(explicit_poll_profile_publishes_nested_source_changes_and_reopens_exactly)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(explicit_poll_profile_publishes_nested_source_changes_and_reopens_exactly)'
slow-timeout = { period = "60s", terminate-after = 5 }
