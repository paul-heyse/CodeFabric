# CodeFabric — project-scoped Codex configuration.
#
# This layer configures repository-owned environment filtering, least-privilege local
# service access, command rules, skills, and the environment hook. Model choice and
# approval posture remain user preferences in ~/.codex/config.toml.
#
# Project config is only read for TRUSTED projects. If nothing here appears to
# take effect, check that ~/.codex/config.toml contains:
#
#   [projects."/Users/paulheyse/CodeFabric"]
#   trust_level = "trusted"
#
# Verified against codex-cli 0.151.0. See .codex/README.md for what was tested
# and how to re-test after a Codex upgrade.

default_permissions = "codefabric"

[features]
network_proxy = true

# Each Codex command begins with a small, predictable inherited environment. The Just
# execution boundary repeats the cleanup so commands remain correct outside Codex too.
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
"VIRTUAL_ENV" = "exclude"
"UV_PROJECT_ENVIRONMENT" = "exclude"
"PYTHONPATH" = "exclude"
"CONDA_*" = "exclude"
"DIRENV_*" = "exclude"
"RUSTUP_TOOLCHAIN" = "exclude"
"RUSTC_WRAPPER" = "exclude"
"CARGO_TARGET_DIR" = "exclude"
"CARGO_INCREMENTAL" = "exclude"
"CODEFABRIC_CPG_CAPABILITY_TOKEN" = "exclude"

# The local cache daemon is the only Unix socket available to general sandboxed
# commands. Cache reads are required by sccache 0.17 client-side StorageGetPath;
# writes remain owned by the supervised host daemon.
[permissions.codefabric]
description = "CodeFabric workspace plus its supervised compiler cache."
extends = ":workspace"

[permissions.codefabric.filesystem]
"~/Library/Caches/CodeFabric/sccache" = "read"
"~/.cache/codefabric/sccache" = "read"

[permissions.codefabric.network.unix_sockets]
"/private/tmp/codefabric-sccache/server.sock" = "allow"
"/tmp/codefabric-sccache/server.sock" = "allow"

[permissions.codefabric.network]
enabled = true

# ---------------------------------------------------------------------------
# Skills
# ---------------------------------------------------------------------------
# The 18 project skills are NOT listed here — they are auto-discovered from
# .codex/skills and .agents/skills, both of which symlink to .claude/skills so
# Claude Code and Codex read one copy. Verified: `codex debug prompt-input`
# lists all 18, from either symlink alone, with no duplication when both exist.
#
# To disable one without deleting it, register it explicitly:
#
#   [[skills.config]]
#   path = ".codex/skills/typer-rich-ref"
#   enabled = false

# ---------------------------------------------------------------------------
# Hooks
# ---------------------------------------------------------------------------
# Mirrors the Claude Code SessionStart hook: inject the bootstrap environment
# report so a session opens knowing toolchain state instead of probing for it.
#
# Matcher values for SessionStart are startup | resume | clear | compact.
# "clear" and "compact" are included because the environment report is just as
# useful after a context reset as at first start.

[[hooks.SessionStart]]
matcher = "^startup$|^resume$|^clear$|^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = ".codex/hooks/session-start.sh"
statusMessage = "Loading CodeFabric environment"
timeout = 20
# The payload is ~3.4 KB / ~860 tokens. This ceiling is a spill threshold, not a hard
# cap -- exceeding it saves the context to disk and shows the model a preview -- but
# the headroom keeps the whole report inline as the corpus grows.
additionalContextLimit = 5200
