# CodeFabric — project-scoped Codex configuration.
#
# This layer configures the project's approval and sandbox posture, its network-proxy
# allowances, repository-owned environment filtering, command rules, skills, and the
# environment hook. Model and reasoning choices remain user preferences in
# ~/.codex/config.toml; approval policy and sandbox mode are set HERE and take
# precedence over the user layer for this project.
#
# POSTURE — deliberately unconfined. Commands run with no approval prompts and no
# filesystem or network sandbox, and the proxy allows every domain, SOCKS5, and every
# Unix socket. The former least-privilege `permissions.codefabric` profile (workspace
# scope plus read-only sccache cache access) and its `default_permissions` selector were
# removed on 2026-08-30. The two sccache sockets are still listed below as the record of
# the only socket a build genuinely needs; under
# `dangerously_allow_all_unix_sockets = true` they grant nothing extra, and they are what
# a narrower posture would restore.
#
# Project config is only read for TRUSTED projects. If nothing here appears to
# take effect, check that ~/.codex/config.toml contains a trusted entry for this
# clone's absolute path:
#
#   [projects."/home/paul/CodeFabric"]        # Linux
#   [projects."/Users/paulheyse/CodeFabric"]  # macOS
#   trust_level = "trusted"
#
# The environment policy, execpolicy rules, and SessionStart hook below were verified
# against codex-cli 0.151.0 on 2026-08-29; see .codex/README.md for what was tested and
# how to re-test after a Codex upgrade. The posture keys above replaced what was verified
# then and have NOT themselves been re-verified.

approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

[features.network_proxy]
enabled = true
allow_local_binding = true
allow_upstream_proxy = true
dangerously_allow_all_unix_sockets = true
dangerously_allow_non_loopback_proxy = true
enable_socks5 = true
enable_socks5_udp = true

[features.network_proxy.unix_sockets]
"/private/tmp/codefabric-sccache/server.sock" = "allow"
"/tmp/codefabric-sccache/server.sock" = "allow"

[features.network_proxy.domains]
"*" = "allow"

# Each Codex command begins with a small, predictable inherited environment. The Just
# execution boundary repeats the cleanup so commands remain correct outside Codex too.
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
"VIRTUAL_ENV" = "exclude"
"UV_PROJECT_ENVIRONMENT" = "exclude"
"PYTHONPATH" = "exclude"
"CONDA_*" = "exclude"
"DIRENV_*" = "exclude"
"RUSTUP_TOOLCHAIN" = "exclude"
"RUSTC_WRAPPER" = "exclude"
"CARGO_TARGET_DIR" = "exclude"
"CARGO_INCREMENTAL" = "exclude"
"CODEFABRIC_CPG_CAPABILITY_TOKEN" = "exclude"

# ---------------------------------------------------------------------------
# Skills
# ---------------------------------------------------------------------------
# The 18 project skills are NOT listed here — they are auto-discovered from
# .codex/skills and .agents/skills, both of which symlink to .claude/skills so
# Claude Code and Codex read one copy. Verified: `codex debug prompt-input`
# lists all 18, from either symlink alone, with no duplication when both exist.
#
# To disable one without deleting it, register it explicitly:
#
#   [[skills.config]]
#   path = ".codex/skills/typer-rich-ref"
#   enabled = false

# ---------------------------------------------------------------------------
# Hooks
# ---------------------------------------------------------------------------
# Mirrors the Claude Code SessionStart hook: inject the bootstrap environment
# report so a session opens knowing toolchain state instead of probing for it.
#
# Matcher values for SessionStart are startup | resume | clear | compact.
# "clear" and "compact" are included because the environment report is just as
# useful after a context reset as at first start.

[[hooks.SessionStart]]
matcher = "^startup$|^resume$|^clear$|^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = ".codex/hooks/session-start.sh"
statusMessage = "Loading CodeFabric environment"
timeout = 20
# The payload is ~3.4 KB / ~860 tokens. This ceiling is a spill threshold, not a hard
# cap -- exceeding it saves the context to disk and shows the model a preview -- but
# the headroom keeps the whole report inline as the corpus grows.
additionalContextLimit = 5200
