# Four-domain Wave 0 CI. Every command maps to a justfile recipe; caches are telemetry
# and acceleration only, never correctness authority.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    name: Domain change routing
    runs-on: ubuntu-latest
    outputs:
      extractor: ${{ steps.paths.outputs.extractor }}
      sidecar: ${{ steps.paths.outputs.sidecar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        name: Select risk-triggered domains
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          extractor=false
          sidecar=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            extractor=true
            sidecar=true
          else
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if grep -Eq '^(rustc-extractor/|contracts/|tooling/proto/|rust-toolchain\.toml)' <<<"$changed"; then
              extractor=true
            fi
            if grep -Eq '^(pyrefly-sidecar/|contracts/|rules/no-pyrefly-public-api\.yml)' <<<"$changed"; then
              sidecar=true
            fi
          fi
          echo "extractor=$extractor" >>"$GITHUB_OUTPUT"
          echo "sidecar=$sidecar" >>"$GITHUB_OUTPUT"

  stable-root:
    name: Stable daemon/data plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - name: Install root gate tools
        run: |
          cargo binstall --no-confirm just@1.58.0
          cargo binstall --no-confirm cargo-nextest@0.9.143
          cargo binstall --no-confirm cargo-deny@0.20.2
          cargo binstall --no-confirm cargo-audit@0.22.2
          cargo binstall --no-confirm cargo-shear@1.13.4
          cargo binstall --no-confirm cargo-machete@0.9.2
          cargo binstall --no-confirm cargo-msrv@0.19.3
          cargo binstall --no-confirm typos-cli@1.49.0
      - name: Stable root routine gate
        run: just root-ci-fast
      - name: Stable root policy and MSRV
        run: |
          just policy
          just msrv
      - name: Upload nextest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7e1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-root-nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
      - name: sccache telemetry
        if: always()
        run: sccache --show-stats

  adapter:
    name: FastMCP adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          python-version: "3.14.7"
          enable-cache: true
      - name: Install command runner
        run: cargo binstall --no-confirm just@1.58.0
      - name: Locked adapter environment
        run: uv sync --frozen --project codefabric-cpg-mcp --python 3.14.7
      - name: Adapter gate
        run: just adapter-ci-fast
      - name: Targeted STDIO diagnostic
        run: just adapter-stdio-test

  contracts:
    name: Model-derived artifacts and interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-18
          components: rustc-dev, rust-src, llvm-tools
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          python-version: "3.14.7"
          enable-cache: true
      - name: Install model gate tools
        run: |
          cargo binstall --no-confirm just@1.58.0
          cargo binstall --no-confirm cargo-nextest@0.9.143
      - name: Locked adapter environment
        run: uv sync --frozen --project codefabric-cpg-mcp --python 3.14.7
      - name: Typed model families and staged consumers
        run: just model-family-check aggregate
      - name: Two-root deterministic DesiredTree
        run: just model-repro-check
      - name: Cross-language Protobuf round trips
        run: |
          cargo nextest run --locked --no-default-features --features rpc --test integration -E 'test(/rust_protobuf_matches_the_shared_wire_fixture/)' --no-tests=fail
          uv run --frozen --project codefabric-cpg-mcp pytest codefabric-cpg-mcp/tests/test_proto.py
      - name: Released fixture and registry assurance
        run: just released-fixture-check
      - name: Released wave acceptance gates
        run: just wave-acceptance-check
      - name: Model compiler bootstrap and released census
        run: |
          just model-bootstrap-check
          just model-release-census-check
      - name: sccache telemetry
        if: always()
        run: sccache --show-stats

  governance:
    name: Structural and graph governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - name: Install governance tools
        run: |
          cargo binstall --no-confirm just@1.58.0
          cargo binstall --no-confirm cargo-deny@0.20.2
          cargo binstall --no-confirm ast-grep@0.45.1
      - name: Structural boundary rules
        run: just governance-scan
      - name: Superseded governance zero state
        run: just model-zero-state-check
      - name: Duplicate-family policy and negative fixture
        run: just duplicate-family-check

  extractor:
    name: Dated-nightly rustc extractor
    needs: changes
    if: needs.changes.outputs.extractor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-18
          components: rustc-dev, rust-src, llvm-tools
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - name: Install command runner
        run: cargo binstall --no-confirm just@1.58.0
      - name: Extractor gate
        run: just extractor-ci-fast
      - name: Extractor protocol silence
        run: |
          stdout="$(mktemp)"
          ./scripts/run_rustc_extractor.sh --identity 1>"$stdout"
          test ! -s "$stdout"
      - name: sccache telemetry
        if: always()
        run: sccache --show-stats

  sidecar:
    name: Stable Pyrefly sidecar
    needs: changes
    if: needs.changes.outputs.sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - name: Install sidecar gate tools
        run: |
          cargo binstall --no-confirm just@1.58.0
          cargo binstall --no-confirm cargo-deny@0.20.2
          cargo binstall --no-confirm cargo-audit@0.22.2
      - name: Sidecar gate and policy
        run: |
          just sidecar-ci-fast
          just sidecar-policy
      - name: Sidecar protocol silence
        run: |
          stdout="$(mktemp)"
          cargo run --quiet --locked --manifest-path pyrefly-sidecar/Cargo.toml -- --identity 1>"$stdout"
          test ! -s "$stdout"
      - name: sccache telemetry
        if: always()
        run: sccache --show-stats
