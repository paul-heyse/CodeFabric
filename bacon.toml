# Bacon: the repository's one persistent Rust check loop (spec section 15).
#
# Ownership rule (spec section 15.1, tooling-ref anti-pattern 72.22):
#
#   rust-analyzer -> semantic model, diagnostics, references, assists
#   Bacon         -> persistent Cargo/rustc check job
#   Watchexec     -> arbitrary non-Rust tasks and process restarts only
#
# Do not configure editor check-on-save, Bacon, and Watchexec to run the same full
# `cargo check` or Clippy command. Jobs here stay cheap; Miri, mutation testing, feature
# powersets, and fuzzing never belong in an every-save loop.
#
# Generated from `bacon --init` (bacon 3.24.0) and reduced to the jobs this repository
# actually wants. Bacon merges these over its built-in defaults.

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.nextest]
command = ["cargo", "nextest", "run", "--hide-progress-bar", "--failure-output", "final"]
need_stdout = true
analyzer = "nextest"

# Machine-readable diagnostics for editors and agents (tooling-ref section 66.1).
# `.bacon-locations` is gitignored. An agent must confirm the file corresponds to the
# current source generation before reading an empty list as success (spec section 15.2).
[exports.locations]
auto = true
path = ".bacon-locations"
line_format = "{kind} {path}:{line}:{column} {message}"
